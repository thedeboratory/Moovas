<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moovas Harvester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      background: #fff;
      color: #141414;
      border: 2px solid #141414;
    }
    .header {
      background: #141414;
      color: #fff;
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .header span { font-size: 18px; font-family: 'Space Grotesk', sans-serif; display: block; letter-spacing: -0.03em; }
    .section { padding: 12px 16px; border-bottom: 2px solid #141414; }
    .section label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: #666; display: block; margin-bottom: 6px; }
    .section input { width: 100%; border: 2px solid #141414; padding: 6px 8px; font-family: inherit; font-size: 11px; outline: none; }
    .section input:focus { background: #f5f5f5; }
    .btn {
      display: block; width: 100%;
      background: #141414; color: #fff;
      border: none; padding: 12px;
      font-family: inherit; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.15em;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #333; }
    .btn:disabled { background: #999; cursor: not-allowed; }
    .status { padding: 10px 16px; font-size: 10px; color: #555; min-height: 36px; }
    .status.ok { color: #1a7f37; }
    .status.err { color: #cf222e; }
    .results { padding: 10px 16px; font-size: 10px; }
    .results .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #eee; }
    .results .row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="header">
    <span>MOOVAS</span>
    Asset Harvester
  </div>

  <div class="section">
    <label>Moovas Instance URL</label>
    <input type="url" id="apiUrl" placeholder="https://your-app.manus.space" />
  </div>

  <div class="section">
    <label>Auth Token (from Moovas settings)</label>
    <input type="password" id="authToken" placeholder="Paste your session token" />
  </div>

  <button class="btn" id="extractBtn">Extract Assets from This Page</button>

  <div class="status" id="status">Ready. Configure your Moovas URL above.</div>

  <div class="results" id="results" style="display:none"></div>

  <script src="popup.js"></script>
</body>
</html>
